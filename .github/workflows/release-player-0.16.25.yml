name: Publish approved Player 0.16.25
on:
  push:
    branches: [main]
    paths: [.github/player-release-0.16.25.json]
permissions:
  contents: write
concurrency:
  group: player-release-0.16.25
  cancel-in-progress: false
jobs:
  publish:
    if: "github.repository == 'Priestkiller/UGSM-Player' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: UGSM Player 0.16.25'"
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and publish the exact approved public client package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish-player-0.16.25.ps1
